<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1b5e20;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            padding: 12px;
        }
        .surah-card {
            background: white;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .surah-title {
            font-size: 17px;
            font-weight: bold;
            color: #2e7d32;
        }
        audio {
            height: 35px;
            outline: none;
        }
    </style>
</head>
<body>

    <header>📖 القرآن الكريم</header>

    <div class="container" id="surah-list">
        <p style="text-align:center;">جاري تحميل الفهرس...</p>
    </div>

    <script src="cordova.js"></script>
    <script>
        document.addEventListener('deviceready', fetchSurahs, false);
        if(!window.cordova) fetchSurahs();

        function fetchSurahs() {
            fetch('https://api.alquran.cloud/v1/surah')
                .then(res => res.json())
                .then(data => {
                    let container = document.getElementById('surah-list');
                    container.innerHTML = '';
                    data.data.forEach(surah => {
                        let num = String(surah.number).padStart(3, '0');
                        let audioUrl = `https://server8.mp3quran.net/afs/${num}.mp3`;
                        
                        let card = document.createElement('div');
                        card.className = 'surah-card';
                        card.innerHTML = `
                            <span class="surah-title">${surah.number}. ${surah.name}</span>
                            <audio controls preload="none">
                                <source src="${audioUrl}" type="audio/mpeg">
                            </audio>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('surah-list').innerHTML = '<p style="text-align:center;color:red;">تحقق من اتصال الإنترنت</p>';
                });
        }
    </script>
</body>
</html>
